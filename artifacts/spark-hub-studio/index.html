<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Spark Hub Studio</title>
    <meta name="description" content="Spark Hub Studio" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Spark Hub Studio" />
    <meta property="og:description" content="Spark Hub Studio" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Spark Hub Studio" />
    <meta name="twitter:description" content="Spark Hub Studio" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- public/index.html -->
<div class="custom-cursor-outer"></div>
<div class="custom-cursor-inner"></div>
<script>
(function () {
    const outer = document.querySelector('.custom-cursor-outer');
    const inner = document.querySelector('.custom-cursor-inner');

    if (!outer || !inner) return;

    let outerX = 0;
    let outerY = 0;
    let targetX = 0;
    let targetY = 0;

    document.addEventListener('mousemove', (e) => {
        targetX = e.clientX;
        targetY = e.clientY;

        inner.style.left = `${e.clientX}px`;
        inner.style.top = `${e.clientY}px`;
    });

    function smoothFollow() {
        outerX += (targetX - outerX) * 0.12;
        outerY += (targetY - outerY) * 0.12;

        outer.style.left = `${outerX}px`;
        outer.style.top = `${outerY}px`;

        requestAnimationFrame(smoothFollow);
    }

    smoothFollow();

    /* تكبير المؤشر فوق العناصر القابلة للضغط */
    document.addEventListener('mouseover', (e) => {
        const target = e.target.closest(
            'a, button, [role="button"], input, textarea, select'
        );

        if (target) {
            outer.classList.add('cursor-hover');
        }
    });

    document.addEventListener('mouseout', (e) => {
        const target = e.target.closest(
            'a, button, [role="button"], input, textarea, select'
        );

        if (target) {
            outer.classList.remove('cursor-hover');
        }
    });

    /* تأثير الضغط */
    document.addEventListener('mousedown', () => {
        inner.classList.add('cursor-click');
        outer.classList.add('cursor-click');

        setTimeout(() => {
            inner.classList.remove('cursor-click');
            outer.classList.remove('cursor-click');
        }, 200);
    });
})();
</script>


<style>
/* ===== SPARK HUB CUSTOM GOLD CURSOR ===== */

:root {
    --cursor-gold: #ac9b3c;
    --cursor-gold-light: #c4b45a;
    --cursor-gold-rgb: 172, 155, 60;
}

* {
    cursor: none !important;
}

/* الدائرة الخارجية */
.custom-cursor-outer {
    position: fixed;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 2px solid var(--cursor-gold);

    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 99999;

    box-shadow:
        0 0 18px rgba(var(--cursor-gold-rgb), 0.18),
        inset 0 0 12px rgba(var(--cursor-gold-rgb), 0.08);

    transition:
        width 0.2s ease,
        height 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

/* النقطة الداخلية */
.custom-cursor-inner {
    position: fixed;
    width: 8px;
    height: 8px;
    border-radius: 50%;

    background: var(--cursor-gold-light);

    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 100000;

    box-shadow:
        0 0 12px rgba(var(--cursor-gold-rgb), 0.9),
        0 0 30px rgba(var(--cursor-gold-rgb), 0.45);
}

/* اللمعة داخل الدائرة */
.custom-cursor-outer::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;

    background: radial-gradient(
        circle at 30% 30%,
        rgba(196, 180, 90, 0.25) 0%,
        rgba(172, 155, 60, 0.10) 45%,
        transparent 75%
    );

    pointer-events: none;

    animation: cursor-glow 2s ease-in-out infinite alternate;
}

@keyframes cursor-glow {
    from {
        opacity: 0.45;
        transform: scale(0.96);
    }

    to {
        opacity: 0.9;
        transform: scale(1.04);
    }
}

/* تكبير المؤشر فوق الروابط والأزرار */
.custom-cursor-outer.cursor-hover {
    width: 80px;
    height: 80px;

    border-color: var(--cursor-gold-light);

    box-shadow:
        0 0 35px rgba(var(--cursor-gold-rgb), 0.25),
        inset 0 0 20px rgba(var(--cursor-gold-rgb), 0.08);
}

/* تأثير الضغط */
.custom-cursor-inner.cursor-click {
    transform: translate(-50%, -50%) scale(2.5);
}

.custom-cursor-outer.cursor-click {
    transform: translate(-50%, -50%) scale(1.25);
}

/* الموبايل / التاتش */
@media (hover: none) and (pointer: coarse) {
    .custom-cursor-outer,
    .custom-cursor-inner {
        display: none !important;
    }

    * {
        cursor: auto !important;
    }
}
</style>


    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
